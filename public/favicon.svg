<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The icon: slate above, the sea below, the split at the cut's height,
       the root's first letter standing across both. -->
  <clipPath id="tile"><rect width="100" height="100" rx="22.5"/></clipPath>
  <g clip-path="url(#tile)">
    <rect width="100" height="48" fill="#242C38"/>
    <rect y="48" width="100" height="52" fill="#1B5E9E"/>
    <rect x="44.5" y="27" width="11" height="59" fill="#FFFFFF"/>
    <rect y="47" width="100" height="2" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>
</svg>
