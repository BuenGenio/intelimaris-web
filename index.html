<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/favicon-180.png">
    <meta name="theme-color" content="#242C38">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--seo:start-->
    <title data-seo>Connected boating, navigation &amp; marina technology | InteliMARIS</title>
    <meta data-seo name="description" content="Plan the passage, monitor your vessel and prepare the arrival with InteliMARIS.">
    <!--seo:end-->
    <link rel="manifest" href="/site.webmanifest">
    <script>
      // Apply the saved/system appearance before the first paint.
      (() => { let saved; try { saved = localStorage.getItem('intelimaris-theme') } catch {} const mode = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = mode; document.documentElement.style.colorScheme = mode; document.querySelector('meta[name="theme-color"]').content = mode === 'dark' ? '#131b25' : '#ffffff' })();
    </script>
    <noscript><style>.fade-in { opacity:1 !important; transform:none !important; } .catalog-sidebar { display:flex !important; } .catalog-mobile-toggle, .role-switcher, .site-preferences, .site-menu-button { display:none !important; }</style></noscript>

    <link rel="preload" href="/assets/fonts/red-hat-display-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/red-hat-text-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="app"></div>
    <div id="lightbox-root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
